name: Forge runtime parity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  parity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate Codex plugin
        shell: pwsh
        run: ./tools/build-forge-codex.ps1
      - name: Verify generated output is committed
        shell: pwsh
        run: |
          $changes = git status --porcelain -- plugins/forge-codex
          if ($changes) {
            $changes
            git diff -- plugins/forge-codex
            throw "Codex plugin output is stale. Run tools/build-forge-codex.ps1 and commit the result."
          }
      - name: Verify Claude and Codex parity
        shell: pwsh
        run: ./tools/test-forge-parity.ps1

      - name: Regenerate standalone skills distribution
        shell: pwsh
        run: ./tools/build-forge-standalone.ps1 -Strict

      - name: Verify standalone output is committed
        shell: pwsh
        run: |
          $changes = git status --porcelain -- dist/forge-standalone
          if ($changes) {
            $changes
            git diff -- dist/forge-standalone
            throw "Standalone output is stale. Run tools/build-forge-standalone.ps1 and commit the result."
          }

      # Skips here by design: the requirements-documents pack is held locally and is
      # not in this repo, so CI cannot compare the extracts against it. The check runs
      # for whoever holds the pack, which is the only party who can regenerate.
      - name: Verify review criteria are current
        shell: pwsh
        run: python tools/build-review-criteria.py --check
